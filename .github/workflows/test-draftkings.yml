name: Test DraftKings NFL Data

on:
  workflow_dispatch:

jobs:
  test-draftkings:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DraftKings test
        run: python test_draftkings.py
