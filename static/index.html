<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>NFL Player Prop Projection Dashboard</title>

<style>
:root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
    box-sizing: border-box;
}

body {
    margin: auto;
    padding: 18px;
    max-width: 900px;
    background: #0b1220;
    color: #f5f7fb;
}

h1 {
    font-size: 27px;
}

p, .small {
    color: #aebbd0;
    line-height: 1.5;
}

.card {
    background: #172235;
    border: 1px solid #34445d;
    border-radius: 16px;
    padding: 18px;
    margin: 15px 0;
}

label {
    display: block;
    margin: 14px 0 6px;
    color: #d9e2ef;
}

select, input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #50617a;
    background: #0d1728;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 14px;
    border: 0;
    border-radius: 11px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    font-weight: 700;
}

.tabs, .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.tabs button {
    background: #26364e;
}

.tabs .active {
    background: #3b82f6;
}

.metric {
    background: #0d1728;
    padding: 13px;
    border-radius: 11px;
    min-width: 0;
}

.label {
    font-size: 12px;
    color: #aebbd0;
}

.value {
    font-size: 22px;
    font-weight: 750;
    margin-top: 6px;
    overflow-wrap: anywhere;
}

.hero {
    text-align: center;
    background: linear-gradient(135deg,#1d3556,#172235);
}

.result {
    font-size: 40px;
    font-weight: 800;
    margin: 12px;
}

.section {
    border-bottom: 1px solid #34445d;
    padding-bottom: 7px;
    margin-top: 23px;
}

.error {
    color: #ffaaaa;
    white-space: pre-wrap;
}

.good {
    color: #86efac;
}

.muted {
    color: #aebbd0;
}

.panel[hidden],
.results[hidden],
.bookresult[hidden] {
    display: none;
}

@media(max-width:450px) {
    body {
        padding: 12px;
    }

    .value {
        font-size: 19px;
    }

    .result {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<header>
    <div class="small" id="connection">
        CONNECTING TO NFL DATA...
    </div>

    <h1>🏈 NFL Player Prop Projections</h1>

    <p>
        Postgame NFL statistics with matchup projections
        and DraftKings/FanDuel player prop comparisons.
    </p>
</header>

<div class="tabs">
    <button
        id="receivingTab"
        class="active"
        onclick="showPanel('receiving')">
        RECEIVING PROPS
    </button>

    <button
        id="rushingTab"
        onclick="showPanel('rushing')">
        RB RUSHING PROPS
    </button>
</div>

<div class="card">
    <h3>1. Select Matchup</h3>

    <label>Offense Team</label>
    <select id="offense">
        <option value="">Loading teams...</option>
    </select>

    <label>Opposing Defense</label>
    <select id="defense">
        <option value="">Loading teams...</option>
    </select>
</div>
